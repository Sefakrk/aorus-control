[package]
name = "aorus-control"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.18"
windows-sys = { version = "0.59", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[build-dependencies]
slint-build = "1.18"
