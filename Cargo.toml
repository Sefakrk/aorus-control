[package]
name = "aorus-control"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
tray-icon = "0.19"
windows-sys = { version = "0.59", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
slint-build = "1.18"
winres = "0.1"
